  <style>
    :root {
      --primary-green: #004d26; 
      --accent-gold: #ffd700;   
      --bg-color: white;      
      --card-bg: #cae8eb;       
    }

    body { 
      font-family: 'Gulzar', serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 360px;
      width: 100%;
      background: var(--card-bg);
      border: 2px solid var(--primary-green);
      border-radius: 15px;
      padding: 5px;
      text-align: center;
      min-height: 90vh;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .header-section {
      margin-bottom: 30px;
    }

    img {
      width: 320px;
      height: 140px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      margin: 10px auto;
      display: block; 
    }

    .main-title {
      background-color: black;
      color: white;
      padding: 1px 50px;
      border-radius: 40px;
      display: inline-block;
      font-size: 22px;
      margin-bottom: 20px;
    }

    .search-box {
      width: 90%;
      padding: 10px;
      margin: 10px auto 20px auto;
      border: 2px solid var(--primary-green);
      border-radius: 20px;
      font-family: 'Gulzar', serif;
      font-size: 16px;
      display: block;
      outline: none;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
    }

    .btn-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    button {
      font-family: 'Gulzar', serif;
      background: black;
      color: white;
      padding: 12px 1px;
      font-size: 18px;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.8);
      transition: 0.3s;
    }

    button:active { transform: scale(0.95); }

    .download-main-btn {
      grid-column: 1 / span 2;
      background: var(--primary-green);
      color: white;
      font-weight: bold;
      border: 2px solid var(--accent-gold);
      margin-top: 15px;
    }

    .page { display: none; animation: fadeIn 0.5s; }
    #home-page { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }

    .footer-box {
      margin-top: 30px;
      padding: 15px;
      background: rgba(0,0,0,0.1);
      border-radius: 15px;
      font-size: 14px;
      color: #333;
    }

    .btn-blue {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }
    
    .btn-blue a {
      flex: 1;
      text-decoration: none;
    }

    .btn-blue button {
      width: 100%; 
      padding: 10px 5px;
      font-size: 14px;
    }
    
    .back-btn { background: #555; width: 100%; margin-top: 20px; }

    /* ڈاؤن لوڈ لسٹ کے لیے نیا اسٹائل (تاکہ بٹن اور ڈیلیٹ آپشن آمنے سامنے رہیں) */
    .download-item-wrapper {
      display: flex;
      gap: 5px;
      align-items: center;
      width: 100%;
    }
    .download-book-btn {
      flex: 4;
    }
    .remove-book-btn {
      flex: 1;
      background: #cc0000;
      color: white;
      font-size: 14px;
      padding: 12px 1px;
    }
    .remove-book-btn:active {
      background: #990000;
    }
  </style>
</head>

  let downloadedBooks = [
    {id: 1, title: "فارسی کی پہلی (آف لائن)", link: "adadia/farsi-ki-pahli.pdf"},
    {id: 2, title: "شرح فارسی کی پہلی (آف لائن)", link: "adadia/sharh-farsi-ki-pahli.pdf"}
  ];

  let currentFilteredBooks = []; 

  function pushAppState() {
    window.history.pushState({ page: "sub" }, "Sub Page", "#subPage");
  }

  function showHomePage() { 
    hideAllPages(); 
    document.getElementById('home-page').style.display = 'block'; 
    clearSearchInputs();
  }
  
  function showJamatPage() { 
    pushAppState(); 
    hideAllPages(); 
    document.getElementById('jamat-page').style.display = 'block'; 
  }
  
  function showtaqreerPage() { 
    pushAppState(); 
    hideAllPages(); 
    document.getElementById('taqreer-page').style.display = 'block'; 
  }

  function showDownloadPage() {
    pushAppState();
    hideAllPages();
    document.getElementById('download-page').style.display = 'block';
    renderDownloads(downloadedBooks);
  }
  
  function hideAllPages() { document.querySelectorAll('.page').forEach(p => p.style.display = 'none'); }

  function clearSearchInputs() {
    document.querySelectorAll('.search-box').forEach(input => input.value = "");
    filterButtons('jamat-page', '');
    filterButtons('taqreer-page', '');
  }

  function filterButtons(pageId, query) {
    const buttons = document.querySelectorAll(`#${pageId} .btn-container button`);
    buttons.forEach(btn => {
      if (btn.innerText.toLowerCase().includes(query.toLowerCase())) {
        btn.style.display = "block";
      } else {
        btn.style.display = "none";
      }
    });
  }

  function renderBooks(filterValue, type) {
    pushAppState(); 
    hideAllPages();
    const listPage = document.getElementById('books-list-page');
    document.getElementById('search-books').value = ""; 
    document.getElementById('list-title').innerText = filterValue;

    currentFilteredBooks = allBooks.filter(b => type === 'jamat' ? b.jamat === filterValue : (type === 'taqreer' ? b.jamat === filterValue : b.cat === filterValue));
    
    displayBooks(currentFilteredBooks);

    const backBtn = document.getElementById('dynamic-back-btn');
    if (type === 'jamat') {
        backBtn.onclick = showJamatPage;
    } else if (type === 'taqreer') {
        backBtn.onclick = showtaqreerPage;
    } else {
        backBtn.onclick = showHomePage;
    }
    
    listPage.style.display = 'block';
  }

  function displayBooks(booksArray) {
    const listContainer = document.getElementById('books-list');
    listContainer.innerHTML = "";
    if(booksArray.length === 0) {
      listContainer.innerHTML = "<p style='grid-column: 1/3;'>کوئی کتاب نہیں ملی</p>";
    } else {
      booksArray.forEach(book => {
        const btn = document.createElement('button');
        btn.innerHTML = "📖 " + book.title;
        btn.onclick = () => openBook(book.title, book.link);
        listContainer.appendChild(btn);
      });
    }
  }

  function filterBooksList(query) {
    const filtered = currentFilteredBooks.filter(b => b.title.toLowerCase().includes(query.toLowerCase()));
    displayBooks(filtered);
  }

  // ڈاؤن لوڈ کی گئی کتابوں کو رینڈر کرنے کا جدید فنکشن بشمول ریمو بٹن
  function renderDownloads(booksArray) {
    const container = document.getElementById('downloads-list');
    const msg = document.getElementById('no-download-msg');
    container.innerHTML = "";
    
    if(booksArray.length === 0) {
      msg.style.display = "block";
    } else {
      msg.style.display = "none";
      booksArray.forEach(book => {
        // ایک ڈیپازٹ ریپر ڈِو بنانا تاکہ بٹن ترتیب میں رہیں
        const wrapper = document.createElement('div');
        wrapper.className = "download-item-wrapper";

        // کتاب پڑھنے کا بٹن
        const readBtn = document.createElement('button');
        readBtn.className = "download-book-btn";
        readBtn.innerHTML = "📥 " + book.title;
        readBtn.onclick = () => openBook(book.title, book.link);

        // کتاب حذف (Remove) کرنے کا بٹن
        const removeBtn = document.createElement('button');
        removeBtn.className = "remove-book-btn";
        removeBtn.innerHTML = "❌";
        removeBtn.title = "حذف کریں";
        removeBtn.onclick = () => removeDownloadedBook(book.id);

        wrapper.appendChild(readBtn);
        wrapper.appendChild(removeBtn);
        container.appendChild(wrapper);
      });
    }
  }

  // کتاب کو ڈاؤن لوڈ لسٹ سے ڈیلیٹ کرنے کا فنکشن
  function removeDownloadedBook(id) {
    if(confirm("کیا آپ اس کتاب کو ڈاؤن لوڈ لسٹ سے حذف کرنا چاہتے ہیں؟")) {
      downloadedBooks = downloadedBooks.filter(book => book.id !== id);
      renderDownloads(downloadedBooks); // اسکرین کو فوراً اپڈیٹ کریں
    }
  }

  function filterDownloadsList(query) {
    const filtered = downloadedBooks.filter(b => b.title.toLowerCase().includes(query.toLowerCase()));
    renderDownloads(filtered);
  }

  // جدید پی ڈی ایف اوپنر فنکشن 
  function openBook(title, link) {
    if(!link || link === "#" || link === "") {
        alert("یہ کتاب ابھی دستیاب نہیں ہے۔");
        return;
    }
    
    /* 
      نوٹ برائے PDF.js: اگر آپ مستقبل میں موزیلا کا PDF.js Viewer اپنی ایپ کے فولڈر میں شامل کرتے ہیں،
      تو آپ نیچے والے کوڈ کو چالو (Uncomment) کر سکتے ہیں:
      
      let pdfJsViewerPath = "pdfjs/web/viewer.html?file=";
      window.open(pdfJsViewerPath + encodeURIComponent(link), '_blank', 'location=no');
      return;
    */

    // فی الحال یہ فائل کو اسمارٹ فون کے اپنے پی ڈی ایف ریڈر/براؤزر ونڈو میں براہ راست کھولے گا
    window.open(link, '_system', 'location=yes');
  }

  // اینڈرائیڈ ہارڈ ویئر بیک بٹن ہینڈلر
  window.onpopstate = function (event) {
    const booksList = document.getElementById('books-list-page');
    const jamatPage = document.getElementById('jamat-page');
    const taqreerPage = document.getElementById('taqreer-page');
    const downloadPage = document.getElementById('download-page');

    if (booksList.style.display === 'block') {
        const title = document.getElementById('list-title').innerText;
        if (title === "نعت" || title === "تقریر") {
            showtaqreerPage();
        } else if (["اعدادیہ","اولیٰ","ثانیہ","ثالثہ","رابعہ","خامسہ","سادسہ","سابعہ"].includes(title)) {
            showJamatPage();
        } else {
            showHomePage();
        }
    } 
    else if (jamatPage.style.display === 'block' || taqreerPage.style.display === 'block' || downloadPage.style.display === 'block') {
        showHomePage();
    } 
    else {
        if (navigator.app && navigator.app.exitApp) {
            navigator.app.exitApp();
        } else if (navigator.device && navigator.device.exitApp) {
            navigator.device.exitApp();
        } else {
            window.history.back();
        }
    }
  };
</script>
</body>
